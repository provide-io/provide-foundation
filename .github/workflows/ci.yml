name: ⚙️ Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include-windows:
        description: 'Include Windows platforms in testing'
        type: boolean
        default: false

permissions:
  contents: read
  security-events: write

jobs:
  ci:
    uses: provide-io/ci-tooling/.github/workflows/python-ci.yml@v0
    with:
      python-version: '3.11'
      platform-preset: standard
      include-windows: ${{ inputs.include-windows || false }}
      coverage-threshold: 0
      run-security: true
      run-secret-scan: true
      upload-coverage: true
      parallel-testing: true
    secrets: inherit
