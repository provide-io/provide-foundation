# Inherit shared configuration from provide-foundry
INHERIT: ../provide-foundry/base-mkdocs.yml

# Project-Specific Configuration
site_name: provide.foundation documentation
site_description: Beautiful, Performant, Structured Logging for Python - Enterprise-grade telemetry built on structlog
site_author: provide.io
site_url: https://foundry.provide.io/foundation/
repo_url: https://github.com/provide-io/provide-foundation
repo_name: provide-io/provide-foundation
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2024-2025 provide.io

# Development server configuration
dev_addr: '127.0.0.1:8001'

# Standalone mode settings
docs_dir: docs

# Project-specific theme overrides
theme:
  logo: assets/images/officium-light.svg
  favicon: assets/images/officium-light.svg
  palette:
    # Light mode - custom colors for provide.foundation
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode - custom colors for provide.foundation
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# Project-specific plugins (in addition to base plugins)
plugins:
  - gen-files:
      scripts:
        - docs/scripts/gen_api.py
  - literate-nav:
      nav_file: SUMMARY.md

nav:
  - Home: index.md
  - Ecosystem: ecosystem.md

  - Overview:
    - Features: information/features.md
    - Use Cases: information/use-cases.md
    - What's New: information/changelog.md

  - Getting Started:
    - getting-started/index.md
    - Installation: getting-started/installation.md
    - 5-Minute Quick Start: getting-started/quick-start.md
    - Build a CLI App Tutorial: getting-started/first-app.md
